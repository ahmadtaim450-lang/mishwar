<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>متابعة رحلة · مشوار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../vendor/leaflet.css">
<script src="../config.js"></script>
<style>
  :root { --p: #0AAFF5; --d: #064854; --y: #FFD25E; --bg: #F3F5F5; --m: #5E7676; --line: #EEF1F1; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--d); font-family: 'Lalezar', system-ui, sans-serif; }
  #map { position: fixed; inset: 0 0 0 0; z-index: 0; }
  .top { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px; left: 12px; z-index: 2; display: flex; gap: 8px; align-items: center; }
  .brand { background: var(--d); color: #fff; border-radius: 14px; padding: 8px 14px; font-size: 20px; }
  .live { margin-inline-start: auto; background: #fff; border-radius: 12px; padding: 6px 12px; font-size: 13px; display: flex; gap: 6px; align-items: center; box-shadow: 0 4px 14px rgba(6,72,84,.12); }
  .dot { width: 9px; height: 9px; border-radius: 9px; background: #1E9E5A; box-shadow: 0 0 0 0 rgba(30,158,90,.6); animation: pulse 1.6s infinite; }
  .dot.off { background: #C7D1D1; animation: none; }
  @keyframes pulse { to { box-shadow: 0 0 0 10px rgba(30,158,90,0); } }
  .sheet { position: fixed; bottom: 0; right: 0; left: 0; z-index: 2; background: #fff; border-radius: 26px 26px 0 0; padding: 14px 18px calc(18px + env(safe-area-inset-bottom)); box-shadow: 0 -10px 30px rgba(6,72,84,.12); max-width: 560px; margin: 0 auto; }
  .grab { width: 44px; height: 5px; border-radius: 5px; background: #DDE3E3; margin: 0 auto 12px; }
  h1 { margin: 0; font-size: 22px; font-weight: 400; }
  .muted { color: var(--m); font-size: 13.5px; }
  .route { display: flex; align-items: center; gap: 10px; margin: 12px 0; }
  .route b { font-weight: 400; font-size: 26px; }
  .route .line { flex: 1; height: 2px; background: repeating-linear-gradient(90deg, #C7D1D1 0 6px, transparent 6px 12px); position: relative; }
  .route .car { position: absolute; top: -11px; font-size: 18px; transition: right 1s; }
  .row { display: flex; gap: 10px; }
  .card { flex: 1; background: var(--bg); border-radius: 16px; padding: 10px 12px; }
  .card .v { font-size: 17px; }
  .plate { display: inline-block; border: 2px solid var(--d); border-radius: 8px; padding: 1px 8px; background: #fff; }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; height: 48px; border-radius: 16px; text-decoration: none; font-size: 16px; }
  .btn.sos { background: #D93A22; color: #fff; }
  .btn.amb { background: #fff; color: var(--d); border: 1.5px solid #DDE3E3; }
  .state { position: fixed; inset: 0; z-index: 3; background: var(--bg); display: none; align-items: center; justify-content: center; text-align: center; padding: 30px; }
  .state.on { display: flex; }
  .state h2 { font-weight: 400; font-size: 26px; margin: 12px 0 6px; }
  .pin { width: 22px; height: 22px; border-radius: 22px; background: var(--p); border: 4px solid #fff; box-shadow: 0 0 0 8px rgba(10,175,245,.25); }
  .dest { width: 16px; height: 16px; border-radius: 4px; background: var(--d); border: 3px solid #fff; }
  .spinner { width: 34px; height: 34px; border: 4px solid #DDE3E3; border-top-color: var(--p); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="map" aria-label="خريطة موقع المسافر"></div>
<div class="top"><span class="brand">مشوار</span><span class="live" id="live"><span class="dot off" id="dot"></span><span id="liveText">عم نتصل...</span></span></div>

<section class="sheet" id="sheet" hidden>
  <div class="grab"></div>
  <h1 id="title">رحلة</h1>
  <div class="muted" id="updated"></div>
  <div class="route" aria-label="الطريق">
    <b id="from"></b>
    <div class="line"><span class="car" id="carIcon" aria-hidden="true">🚗</span></div>
    <b id="to"></b>
  </div>
  <div class="row">
    <div class="card"><div class="muted">الانطلاق</div><div class="v" id="dep"></div></div>
    <div class="card"><div class="muted">الوصول المتوقع</div><div class="v" id="arr"></div></div>
  </div>
  <div class="row" style="margin-top:10px">
    <div class="card"><div class="muted">السائق والسيارة</div><div class="v" id="car"></div><div style="margin-top:4px"><span class="plate" id="plate"></span></div></div>
  </div>
  <div class="actions">
    <a class="btn sos" href="tel:112">طوارئ 112</a>
    <a class="btn amb" href="tel:110">إسعاف 110</a>
  </div>
</section>

<div class="state on" id="loading"><div><div class="spinner"></div><h2>عم نجيب الرحلة...</h2></div></div>
<div class="state" id="invalid"><div><h2>الرابط مو صالح</h2><p class="muted">ممكن الرحلة خلصت أو انلغت، أو الرابط انتهت صلاحيتو. اطلب رابط جديد من المسافر.</p></div></div>
<div class="state" id="nocfg"><div><h2>المتابعة مو مفعّلة لسا</h2><p class="muted">هالخدمة بتشتغل بعد ربط مشوار بالسيرفر.</p></div></div>

<script src="../vendor/leaflet.js"></script>
<script>
(function () {
  'use strict';
  var cfg = window.MISHWAR || {};
  var token = new URLSearchParams(location.search).get('t') || '';
  var $ = function (id) { return document.getElementById(id); };
  function show(id) { ['loading', 'invalid', 'nocfg'].forEach(function (s) { $(s).classList.toggle('on', s === id); }); $('sheet').hidden = id !== null; }
  // النصوص بتنحط كنص مو كـ HTML (حماية من XSS)
  function setText(id, v) { $(id).textContent = v == null ? '' : String(v); }
  function fmtTime(iso) {
    var d = new Date(iso);
    return d.toLocaleTimeString('ar-SY', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Damascus' });
  }
  function ago(iso) {
    var s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
    if (s < 60) return 'هلق';
    if (s < 3600) return 'قبل ' + Math.round(s / 60) + ' دقيقة';
    return 'قبل ' + Math.round(s / 3600) + ' ساعة';
  }

  var CITY = {
    damascus: [33.5138, 36.2765], aleppo: [36.2021, 37.1343], latakia: [35.5196, 35.7832], homs: [34.7324, 36.7137],
    tartus: [34.8890, 35.8866], hama: [35.1318, 36.7578], jableh: [35.3610, 35.9256], daraa: [32.6189, 36.1021],
    banias: [35.1828, 35.9486], idlib: [35.9306, 36.6339], raqqa: [35.95, 39.01], deir_ez_zor: [35.336, 40.14],
    hasakah: [36.5, 40.75], qamishli: [37.05, 41.22], sweida: [32.709, 36.566], palmyra: [34.56, 38.28],
    salamiyah: [35.011, 37.053], safita: [34.82, 36.117], qardaha: [35.456, 36.056], manbij: [36.528, 37.955],
    quneitra: [33.126, 35.824], nabk: [34.0237, 36.728]
  };

  if (!cfg.url || !cfg.anon) { show('nocfg'); return; }
  if (!/^[0-9a-f]{36}$/.test(token)) { show('invalid'); return; }

  var map = L.map('map', { zoomControl: false, attributionControl: true }).setView([34.8, 36.6], 7);
  L.tileLayer(cfg.tiles || 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: cfg.attribution || '© OpenStreetMap contributors' }).addTo(map);
  var me = null, dest = null, fitted = false;

  function load() {
    fetch(cfg.url + '/rest/v1/rpc/get_shared_trip', {
      method: 'POST',
      headers: { 'apikey': cfg.anon, 'Authorization': 'Bearer ' + cfg.anon, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_token: token })
    }).then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); })
      .then(function (d) {
        if (!d) { show('invalid'); clearInterval(timer); return; }
        show(null);
        setText('title', (d.rider ? d.rider + ' مسافر' : 'مسافر') + ' مع مشوار');
        setText('from', d.from); setText('to', d.to);
        setText('dep', fmtTime(d.departure_at)); setText('arr', fmtTime(d.arrival_at));
        setText('car', (d.driver || '') + ' · ' + (d.car || '')); setText('plate', d.plate || '');
        var total = new Date(d.arrival_at) - new Date(d.departure_at);
        var p = Math.min(1, Math.max(0, (Date.now() - new Date(d.departure_at)) / total));
        $('carIcon').style.right = 'calc(' + (p * 100) + '% - 9px)';
        var to = CITY[d.to_city];
        if (to && !dest) dest = L.marker(to, { icon: L.divIcon({ className: '', html: '<div class="dest"></div>', iconSize: [16, 16] }) }).addTo(map);
        if (d.location) {
          var ll = [d.location.lat, d.location.lon];
          if (!me) me = L.marker(ll, { icon: L.divIcon({ className: '', html: '<div class="pin"></div>', iconSize: [22, 22] }) }).addTo(map);
          else me.setLatLng(ll);
          var fresh = Date.now() - new Date(d.location.updated_at).getTime() < 3 * 60 * 1000;
          $('dot').classList.toggle('off', !fresh);
          setText('liveText', fresh ? 'مباشر' : 'آخر موقع ' + ago(d.location.updated_at));
          setText('updated', 'آخر تحديث للموقع ' + ago(d.location.updated_at));
          if (!fitted) { map.fitBounds(to ? L.latLngBounds([ll, to]) : L.latLngBounds([ll, ll]), { padding: [60, 60], maxZoom: 12 }); fitted = true; }
        } else {
          $('dot').classList.add('off');
          setText('liveText', d.status === 'scheduled' ? 'الرحلة لسا ما بلّشت' : 'ما في موقع لسا');
          setText('updated', 'رح يظهر الموقع أول ما تبلّش الرحلة');
          if (!fitted && to) { map.setView(to, 9); fitted = true; }
        }
        if (d.status === 'completed') { setText('liveText', 'وصل بالسلامة'); $('dot').classList.add('off'); clearInterval(timer); }
      })
      .catch(function () { setText('liveText', 'ما في اتصال، عم نعيد المحاولة'); $('dot').classList.add('off'); });
  }
  var timer = setInterval(load, 15000);
  load();
})();
</script>
</body>
</html>
