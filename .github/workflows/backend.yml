name: Backend tests

on:
  push:
    branches: [main]
    paths: ['supabase/**', 'site/**', 'lib/data/**', 'test/integration/**', '.github/workflows/backend.yml']
  workflow_dispatch:

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (applies migrations)
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor,postgres-meta,realtime

      - name: Run database tests
        shell: bash
        run: |
          set +e
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 -f supabase/tests/flows_test.sql > db-test.log 2>&1
          status=$?
          grep -E "▶|✓" db-test.log
          if [ $status -ne 0 ]; then
            grep -E "ERROR|FAIL" db-test.log | head -20 | while read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Serve edge functions
        run: |
          printf 'PUSH_SECRET=test-push-secret\nADMIN_ORIGINS=http://127.0.0.1:8080\n' > supabase/functions/.env
          nohup supabase functions serve --env-file supabase/functions/.env > functions.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:54321/functions/v1/push | grep -qv '^5\|^000' && break; sleep 3; done
          tail -5 functions.log

      - name: End-to-end API test (Auth + REST + Storage + Functions)
        shell: bash
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          npm install --no-save --silent @supabase/supabase-js@2
          set +e
          node supabase/tests/e2e.mjs > e2e.log 2>&1
          status=$?
          cat e2e.log
          if [ $status -ne 0 ]; then
            tail -30 functions.log
            msg=$(grep -E "✗|Error" e2e.log | head -60 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::$msg"
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter app ↔ Supabase integration test
        shell: bash
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          mkdir -p assets/images assets/fonts
          curl -fsSL -o assets/fonts/Lalezar-Regular.ttf https://github.com/google/fonts/raw/main/ofl/lalezar/Lalezar-Regular.ttf
          flutter pub get > /dev/null
          set +e
          flutter test test/integration --reporter expanded --dart-define=SUPABASE_TEST_URL="$API_URL" --dart-define=SUPABASE_TEST_ANON="$ANON_KEY" --dart-define=SUPABASE_TEST_SERVICE="$SERVICE_ROLE_KEY" > it.log 2>&1
          status=$?
          tail -20 it.log
          if [ $status -ne 0 ]; then
            msg=$(grep -E -A4 "was thrown|Expected:|Actual:|Error|Exception|\[E\]" it.log | grep -v "^#[0-9]" | awk '!s[$0]++' | head -80 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::$msg"
            exit 1
          fi

      - name: Web pages browser test
        run: |
          npm install --no-save --silent playwright@1
          npx playwright install --with-deps chromium > /dev/null
          node site/test/pages.test.mjs

      - name: Lint SQL (security advisor)
        run: supabase db lint --level warning || true
