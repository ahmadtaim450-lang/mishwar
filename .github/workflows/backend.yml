name: Backend tests

on:
  push:
    branches: [main]
    paths: ['supabase/**', 'site/**', '.github/workflows/backend.yml']
  workflow_dispatch:

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (applies migrations)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime

      - name: Run database tests
        shell: bash
        run: |
          set +e
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 -f supabase/tests/flows_test.sql > db-test.log 2>&1
          status=$?
          grep -E "▶|✓" db-test.log
          if [ $status -ne 0 ]; then
            grep -E "ERROR|FAIL" db-test.log | head -20 | while read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: End-to-end API test (Auth + REST + Storage)
        shell: bash
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          npm install --no-save --silent @supabase/supabase-js@2
          set +e
          node supabase/tests/e2e.mjs > e2e.log 2>&1
          status=$?
          cat e2e.log
          if [ $status -ne 0 ]; then
            msg=$(grep -E "✗|Error" e2e.log | head -60 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::$msg"
            exit 1
          fi

      - name: Web pages browser test
        run: |
          npm install --no-save --silent playwright@1
          npx playwright install --with-deps chromium > /dev/null
          node site/test/pages.test.mjs

      - name: Lint SQL (security advisor)
        run: supabase db lint --level warning || true
