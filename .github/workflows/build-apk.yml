name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files
        run: flutter create --platforms=android --org com.mishwar --project-name mishwar .

      - name: Download font
        run: |
          mkdir -p assets/fonts
          curl -fsSL -o assets/fonts/Lalezar-Regular.ttf \
            https://github.com/google/fonts/raw/main/ofl/lalezar/Lalezar-Regular.ttf

      - name: Download illustrations
        run: |
          mkdir -p assets/images assets/videos
          while read -r path url; do
            [ -z "$path" ] && continue
            curl -fsSL -o "$path" "$url" || echo "skip $path"
          done < assets/manifest.txt
          ls assets/images | wc -l

      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Remove flat backgrounds from illustrations
        run: |
          cd assets/images
          for f in onboard1 onboard2 onboard3 women_only family booked published welcome \
                   city_damascus city_aleppo city_latakia city_homs city_tartus city_hama city_jableh city_daraa; do
            [ -f "$f.png" ] || continue
            W=$(identify -format "%w" "$f.png"); H=$(identify -format "%h" "$f.png")
            X=$((W-1)); Y=$((H-1))
            convert "$f.png" -alpha set -fuzz 9% -fill none \
              -draw "color 0,0 floodfill" -draw "color $X,0 floodfill" \
              -draw "color 0,$Y floodfill" -draw "color $X,$Y floodfill" \
              -draw "color $((W/2)),0 floodfill" -draw "color 0,$((H/2)) floodfill" -draw "color $X,$((H/2)) floodfill" \
              "$f.png" && echo "cleaned $f"
          done

      - name: Shrink images
        run: |
          cd assets/images
          for f in *.png; do convert "$f" -resize '900x900>' -strip -define png:compression-level=9 "$f"; done
          du -sh .

      - name: App name and icon
        run: |
          sed -i 's/android:label="mishwar"/android:label="مشوار"/' android/app/src/main/AndroidManifest.xml
          RES=android/app/src/main/res
          if [ -f assets/images/app_icon.png ]; then
            # قصّ الحواف، وشيل الزوايا المدوّرة لحتى الأيقونة تملا الشكل
            convert assets/images/app_icon.png -fuzz 12% -trim +repage /tmp/icon_trim.png
            convert /tmp/icon_trim.png -gravity center -shave 9%x9% +repage /tmp/icon_full.png
            for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
              dir=mipmap-$(echo $d | cut -d: -f1); s=$(echo $d | cut -d: -f2); f=$(echo $d | cut -d: -f3)
              mkdir -p $RES/$dir
              convert /tmp/icon_trim.png -resize ${s}x${s}! $RES/$dir/ic_launcher.png
              convert /tmp/icon_full.png -resize ${s}x${s}! \( +clone -alpha extract -fill black -colorize 100 -fill white -draw "circle $((s/2)),$((s/2)) $((s/2)),0" \) -alpha off -compose CopyOpacity -composite $RES/$dir/ic_launcher_round.png
              convert /tmp/icon_full.png -resize ${f}x${f}! $RES/$dir/ic_launcher_foreground.png
            done
            mkdir -p $RES/mipmap-anydpi-v26 $RES/values
            for n in ic_launcher ic_launcher_round; do
              printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n  <background android:drawable="@color/ic_launcher_background"/>\n  <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n' > $RES/mipmap-anydpi-v26/$n.xml
            done
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="ic_launcher_background">#0AAFF5</color>\n</resources>\n' > $RES/values/ic_launcher_background.xml
            grep -q 'android:roundIcon' android/app/src/main/AndroidManifest.xml || sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"|' android/app/src/main/AndroidManifest.xml
            ls $RES/mipmap-xxxhdpi
          else
            echo "::warning::app_icon.png missing"
          fi

      - run: flutter pub get

      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || true
          grep -E "error •" analyze.txt | head -60 | while read -r l; do echo "::error::$l"; done
          grep -c "error •" analyze.txt || true

      - name: Build APK
        shell: bash
        run: |
          set +e
          flutter build apk --release --split-per-abi 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            grep -E "Error|error:|FAILURE|What went wrong" -A2 build.log | head -60 | while read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: مشوار ${{ github.run_number }}
          body: |
            نسخة تجريبية من تطبيق مشوار.
            لمعظم الموبايلات نزّل الملف اللي اسمو فيه arm64-v8a.
          files: build/app/outputs/flutter-apk/*.apk
